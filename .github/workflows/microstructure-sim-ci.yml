name: Microstructure simulator CI

on:
  pull_request:
    paths:
      - 'microstructure-sim/**'
      - '.gitattributes'
      - '.github/workflows/microstructure-sim-ci.yml'
  push:
    branches:
      - main
      - 'research/**'
    paths:
      - 'microstructure-sim/**'
      - '.gitattributes'
      - '.github/workflows/microstructure-sim-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microstructure-sim-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONUTF8: '1'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: microstructure-sim/requirements.lock.txt

      - name: Install from the hash-enforced lock
        run: |
          python -m pip install --require-hashes -r microstructure-sim/requirements.lock.txt
          python -m pip install -e microstructure-sim --no-deps --no-build-isolation
          python -m pip check

      - name: Byte-compile
        run: python -m compileall -q microstructure-sim/src

      - name: Run test suite
        run: python -m pytest microstructure-sim -q

      - name: Verify frozen controls
        run: python -m mechsim.cli verify

      - name: Outcome-blind pipeline smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m mechsim.reproduce --smoke

      - name: Record environment and digests
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'source_commit=%s\n' "${SOURCE_SHA}"
            printf 'workflow_commit=%s\n' "$GITHUB_SHA"
            printf 'runner_image=%s\n' "${ImageOS:-ubuntu24}"
            printf 'python=%s\n' "$(python --version 2>&1)"
          } > microstructure-sim-environment.txt
          python -m pip freeze --all >> microstructure-sim-environment.txt
          sha256sum \
            microstructure-sim/pyproject.toml \
            microstructure-sim/requirements.lock.txt \
            microstructure-sim/src/mechsim/mechanisms.py \
            microstructure-sim/src/mechsim/flow.py \
            microstructure-sim/src/mechsim/book.py \
            microstructure-sim/src/mechsim/sim.py \
            microstructure-sim/src/mechsim/analysis.py \
            >> microstructure-sim-environment.txt
          cat microstructure-sim-environment.txt

      - name: Upload simulator environment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: microstructure-sim-environment-${{ env.SOURCE_SHA }}
          path: microstructure-sim-environment.txt
          if-no-files-found: error
          retention-days: 14
