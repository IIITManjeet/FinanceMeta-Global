name: Workflow supply-chain contract

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tests/test_workflow_supply_chain_contract.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'tests/test_workflow_supply_chain_contract.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-supply-chain-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Verify engineering workflow supply chain
        run: python -m unittest tests/test_workflow_supply_chain_contract.py -v
