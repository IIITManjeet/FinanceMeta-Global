[build-system]
requires = ["setuptools==72.2.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mechsim"
version = "0.1.0"
description = "Deterministic limit-order-book simulator for a frozen two-mechanism allocation comparison"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = "==3.12.*"
authors = [{name = "Manjeet Pathak"}]
dependencies = ["numpy==2.0.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
mechsim = "mechsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
